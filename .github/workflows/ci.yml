name: W's CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Go Backend Verification & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/api/go.sum

      - name: Verify Go Dependencies
        working-directory: services/api
        run: go mod verify

      - name: Run Go Vet
        working-directory: services/api
        run: go vet ./...

      - name: Run Go Integration Test Suites
        working-directory: services/api
        run: go test -v -race -cover ./tests

      - name: Build Go Server Binary
        working-directory: services/api
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -ldflags="-s -w" -o bin/server ./cmd/server

  mobile-ci:
    name: Flutter Mobile Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run Static Analysis
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Widget & Unit Tests
        working-directory: apps/mobile
        run: flutter test
